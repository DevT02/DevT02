name: Generate README Metrics

on:
  schedule:
    - cron: "0 8 * * *" # daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: true

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      # Main card
      - name: Generate metrics.svg
        uses: lowlighter/metrics@latest
        with:
          user: DevT02
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}

          template: classic
          config_timezone: America/Detroit

          # Remove "repositories" to avoid the confusing "1 Repository" block
          base: header, activity, community, metadata

          # A few nice extras for a profile
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          output_action: commit
          output_branch: metrics
          filename: metrics.svg

      # Languages card
      - name: Generate metrics.langs.svg
        uses: lowlighter/metrics@latest
        with:
          user: DevT02
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}

          template: classic
          base: ""

          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: bytes-size, percentage
          plugin_languages_indepth: no

          # Skip your profile README repo so it doesn’t skew the chart
          plugin_languages_skipped: DevT02/DevT02

          # Ignore “junk” languages (tweak as you like)
          plugin_languages_ignored: html, css, scss, shell, powershell, batchfile, svg

          # Optional: unify TSX into TypeScript
          plugin_languages_aliases: tsx:TypeScript

          output_action: commit
          output_branch: metrics
          filename: metrics.langs.svg
