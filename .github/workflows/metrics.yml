name: Generate README Metrics

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: true

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      # Main card (no big commit totals)
      - name: Generate metrics.svg
        uses: lowlighter/metrics@latest
        with:
          user: DevT02
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}

          template: classic
          config_timezone: America/Detroit

          # Remove "activity" to stop the big commits/contrib summary
          base: header, community, metadata

          # Keep the 10y calendar (this is fine)
          plugin_calendar: yes
          plugin_calendar_limit: 10

          output_action: commit
          committer_branch: metrics
          filename: metrics.svg

      # Languages card (focused on current repos)
      - name: Generate metrics.langs.svg
        uses: lowlighter/metrics@latest
        with:
          user: DevT02
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}

          template: classic
          base: header

          plugin_languages: yes
          plugin_languages_sections: most-used, recently-used

          # recently-used is effectively ~last year anyway
          plugin_languages_recent_load: 1000

          # KEY: focus languages on your current projects
          plugin_languages_indepth: yes
          plugin_languages_indepth_custom: DevT02/notelify,DevT02/ForgetGate,DevT02/Junk-Remover

          plugin_languages_limit: 8
          plugin_languages_details: bytes-size, percentage
          plugin_languages_ignored: html, css, scss, shell, powershell, batchfile, svg
          plugin_languages_aliases: tsx:TypeScript

          output_action: commit
          committer_branch: metrics
          filename: metrics.langs.svg
