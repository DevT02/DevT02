name: Generate README Metrics

on:
  schedule:
    - cron: "0 8 * * *" # daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: true

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      # Main card
      - name: Generate metrics.svg
        uses: lowlighter/metrics@latest
        with:
          user: DevT02
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
      
          template: classic
          config_timezone: America/Detroit
      
          base: header, activity, community, metadata
      
          # Multi-year commit history
          plugin_calendar: yes
          plugin_calendar_limit: 10   # or 0 for full history
      
          output_action: commit
          output_branch: metrics
          filename: metrics.svg


      # Languages card
      - name: Generate metrics.langs.svg
        uses: lowlighter/metrics@latest
        with:
          user: DevT02
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
      
          template: classic
      
          # IMPORTANT: don't leave base empty; keep at least header for consistent rendering
          base: header
      
          plugin_languages: yes
      
          # Show BOTH:
          plugin_languages_sections: most-used, recently-used
      
          plugin_languages_recent_days: 3650
      
          # Pull more events so 10y has enough signal
          plugin_languages_recent_load: 1000
      
          plugin_languages_limit: 8
          plugin_languages_details: bytes-size, percentage
          plugin_languages_indepth: no
      
          plugin_languages_skipped: DevT02/DevT02
          plugin_languages_ignored: html, css, scss, shell, powershell, batchfile, svg
          plugin_languages_aliases: tsx:TypeScript
      
          output_action: commit
          output_branch: metrics
          filename: metrics.langs.svg
