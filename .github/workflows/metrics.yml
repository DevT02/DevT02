name: Generate README Metrics

on:
  schedule:
    - cron: "0 8 * * *" # daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate metrics.svg
        uses: lowlighter/metrics@latest
        with:
          user: DevT02
          token: ${{ secrets.GITHUB_TOKEN }}
          template: classic
          config_timezone: America/Detroit
          base: header, activity, community, repositories, metadata
          output_action: commit
          output_branch: metrics
          filename: metrics.svg

      - name: Generate metrics.langs.svg
        uses: lowlighter/metrics@latest
        with:
          user: DevT02
          token: ${{ secrets.GITHUB_TOKEN }}
          template: classic
          base: ""
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_limit: 8
          plugin_languages_details: bytes-size, percentage
      
          # 1) Remove tiny junk entries (like 0.3% JS)
          plugin_languages_threshold: 2%
      
          # 2) Only show real “code” categories (cuts CSS/HTML/etc)
          plugin_languages_categories: programming, data
          plugin_languages_recent_categories: programming, data
      
          # 3) Hard-ignore stuff you never want listed (even if it sneaks in)
          plugin_languages_ignored: >-
            shell, powershell, batchfile, css, scss, html
      
          # 4) Fix mislabeled languages (TSX -> TypeScript)
          plugin_languages_aliases: >-
            tsx:TypeScript
      
          output_action: commit
          output_branch: metrics
          filename: metrics.langs.svg

