name: Generate README Metrics

on:
  schedule:
    - cron: "0 8 * * *" # daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate metrics.svg
        uses: lowlighter/metrics@latest
        with:
          user: DevT02
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          template: classic
          config_timezone: America/Detroit
          base: header, activity, community, repositories, metadata
          output_action: commit
          output_branch: metrics
          filename: metrics.svg

      - name: Generate metrics.langs.svg
        uses: lowlighter/metrics@latest
        with:
          user: DevT02
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          template: classic
          base: ""
          plugin_languages: yes
          plugin_languages_limit: 10
          plugin_languages_details: bytes-size, percentage

          # Better “overall stack” view than indepth commit-based analysis
          plugin_languages_indepth: no

          # Ignore junk “languages”
          plugin_languages_ignored: html,css,scss,shell,powershell,batchfile,svg

          # Optional: unify TSX into TypeScript if it appears
          plugin_languages_aliases: tsx:TypeScript

          output_action: commit
          output_branch: metrics
          filename: metrics.langs.svg
