name: Update README with Latest Repo

on:
  schedule:
    - cron: "0 * * * *"
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Check if repository is public
        id: check_visibility
        run: |
          REPO_VISIBILITY=$(curl -s "https://api.github.com/repos/${{ github.repository }}" | jq -r '.visibility')
          echo "Repository visibility: $REPO_VISIBILITY"
          echo "visibility=$REPO_VISIBILITY" >> $GITHUB_OUTPUT
          if [ "$REPO_VISIBILITY" != "public" ]; then
            echo "Repository is not public. Exiting."
            exit 0
          fi

      - name: Get latest repository info
        id: get_latest
        run: |
          # Fetch the most recently updated public repo from your account
          LATEST_JSON=$(curl -s "https://api.github.com/users/DevT02/repos?sort=updated&per_page=1")
          REPO_NAME=$(echo "$LATEST_JSON" | jq -r '.[0].name')
          REPO_URL=$(echo "$LATEST_JSON" | jq -r '.[0].html_url')
          REPO_DESCRIPTION=$(echo "$LATEST_JSON" | jq -r '.[0].description')
          
          # If no description is provided, generate one using the languages used
          if [ "$REPO_DESCRIPTION" = "null" ] || [ -z "$REPO_DESCRIPTION" ]; then
            LANGUAGES=$(curl -s "https://api.github.com/repos/DevT02/$REPO_NAME/languages" | jq -r 'keys | join(", ")')
            if [ -z "$LANGUAGES" ]; then
              REPO_DESCRIPTION="A recent project by Devansh."
            else
              REPO_DESCRIPTION="A recent project built using: $LANGUAGES."
            fi
          fi
          
          # Generate tech stack HTML snippet based on languages used
          LANGUAGES_JSON=$(curl -s "https://api.github.com/repos/DevT02/$REPO_NAME/languages")
          TECH_STACK_HTML="<p>"
          for lang in $(echo "$LANGUAGES_JSON" | jq -r 'keys[]'); do
            # Convert language name to lowercase (adjust if needed)
            lang_lower=$(echo "$lang" | tr '[:upper:]' '[:lower:]')
            TECH_STACK_HTML+="<span><img src=\"https://skillicons.dev/icons?i=${lang_lower}\" alt=\"${lang}\"></span> "
          done
          TECH_STACK_HTML+="</p>"
          
          echo "Latest Repo Name: $REPO_NAME"
          echo "Latest Repo URL: $REPO_URL"
          echo "Latest Repo Description: $REPO_DESCRIPTION"
          echo "Tech Stack HTML: $TECH_STACK_HTML"
          
          echo "repo_name=$REPO_NAME" >> $GITHUB_OUTPUT
          echo "repo_url=$REPO_URL" >> $GITHUB_OUTPUT
          echo "repo_description=$REPO_DESCRIPTION" >> $GITHUB_OUTPUT
          echo "tech_stack_html=$TECH_STACK_HTML" >> $GITHUB_OUTPUT

      - name: Update README section
        if: steps.check_visibility.outputs.visibility == 'public'
        run: |
          # Build the new content block using a heredoc for proper multiline handling.
          NEW_CONTENT=$(cat <<EOF
<td align="center" width="33%">
  <h3><img src="https://img.shields.io/badge/NEW-2188ff?style=flat-square" alt="NEW"> Most Recent</h3>
  <div align="center">
    <h4>
      <img src="https://skillicons.dev/icons?i=ts" height="25"/>
      <a href="${{ steps.get_latest.outputs.repo_url }}">${{ steps.get_latest.outputs.repo_name }}</a>
    </h4>
    <p>${{ steps.get_latest.outputs.repo_description }}</p>
    ${{ steps.get_latest.outputs.tech_stack_html }}
  </div>
</td>
EOF
          )
          
          # Replace everything between the markers with the new content.
          sed -i "/<!-- BEGIN LATEST REPO SECTION -->/,/<!-- END LATEST REPO SECTION -->/c\\
<!-- BEGIN LATEST REPO SECTION -->\\
$NEW_CONTENT\\
<!-- END LATEST REPO SECTION -->" README.md

      - name: Commit changes
        if: steps.check_visibility.outputs.visibility == 'public'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Updated README with latest repository details and tech stack" || echo "No changes to commit"
          git push origin main
